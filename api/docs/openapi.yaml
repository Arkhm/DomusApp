        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /users/{id}:
    get:
      tags:
        - users
      summary: Buscar usuário
      description: "Perfis permitidos: ADMIN, FUNCIONARIO. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
