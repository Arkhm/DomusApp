              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    type:
                      type: string
                      enum:
                        - APARTMENT
                        - HOUSE
                    block:
                      type: string
                      maxLength: 50
                    number:
                      type: string
                      minLength: 1
                      maxLength: 20
                    parkingSpots:
                      oneOf:
                        - type: integer
                          minimum: 0
                          maximum: 20
                        - type: string
                          pattern: ^([0-9]|1[0-9]|20)$
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
