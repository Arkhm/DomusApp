components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: domusapp_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - error
    Message:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        client:
          type: string
          enum:
            - mobile
      required:
        - email
        - password
    Register:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: De 8 caracteres a 72 bytes UTF-8. Nunca registrar em logs.
      required:
        - name
        - email
        - password
    Refresh:
      type: object
      properties:
        client:
          type: string
          enum:
            - mobile
        refreshToken:
          type: string
          maxLength: 4096
          description: Mobile; web usa cookie httpOnly domusapp_refresh.
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 191
      required:
        - email
    ResetPassword:
      type: object
      properties:
        token:
          type: string
          format: uuid
        newPassword:
          type: string
          format: password
          minLength: 8
          description: De 8 caracteres a 72 bytes UTF-8. Nunca registrar em logs.
      required:
        - token
        - newPassword
    UserCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        cpf:
          type: string
          description: CPF válido; pontuação removida.
        phone:
          type: string
          description: Vazio ou 10/11 dígitos com DDD.
        password:
          type: string
          format: password
          minLength: 8
          description: De 8 caracteres a 72 bytes UTF-8. Nunca registrar em logs.
        role:
          type: string
          enum:
            - ADMIN
            - FUNCIONARIO
            - MORADOR
        unitId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        isSyndic:
          type: boolean
        isCouncilMember:
          type: boolean
      required:
        - name
        - email
        - cpf
        - password
      description: MORADOR precisa de unidade válida conforme regra do serviço.
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        cpf:
          type: string
          description: CPF válido; pontuação removida.
        phone:
          type: string
          description: Vazio ou 10/11 dígitos com DDD.
        password:
          type: string
          format: password
          minLength: 8
          description: De 8 caracteres a 72 bytes UTF-8. Nunca registrar em logs.
        role:
          type: string
          enum:
            - ADMIN
            - FUNCIONARIO
            - MORADOR
        unitId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        isSyndic:
          type: boolean
        isCouncilMember:
          type: boolean
    UnitCreate:
      type: object
      properties:
        type:
          type: string
          enum:
            - APARTMENT
            - HOUSE
        block:
          type: string
          maxLength: 50
        number:
          type: string
          minLength: 1
          maxLength: 20
        parkingSpots:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 20
            - type: string
              pattern: ^([0-9]|1[0-9]|20)$
      required:
        - number
    UnitUpdate:
      type: object
      properties:
        type:
          type: string
          enum:
            - APARTMENT
            - HOUSE
        block:
          type: string
          maxLength: 50
        number:
          type: string
          minLength: 1
          maxLength: 20
        parkingSpots:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 20
            - type: string
              pattern: ^([0-9]|1[0-9]|20)$
    NoticeCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        targetType:
          type: string
          enum:
            - ALL
            - UNIT
        targetUnitId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
        priority:
          type: string
          enum:
            - NORMAL
            - URGENT
      required:
        - title
        - content
      description: targetUnitId é obrigatório quando targetType=UNIT.
    EventCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        eventDate:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 200
        targetType:
          type: string
          enum:
            - ALL
            - UNIT
        targetUnitId:
          type: string
          format: uuid
        category:
          type: string
          enum:
            - ASSEMBLEIA
            - CONFRATERNIZACAO
            - MANUTENCAO
            - REUNIAO
            - OUTRO
        capacity:
          type: integer
          minimum: 1
          nullable: true
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - CANCELLED
      required:
        - title
        - content
        - eventDate
      description: targetUnitId é obrigatório quando targetType=UNIT.
    VotingCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        options:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 2
      required:
        - title
        - description
        - startDate
        - endDate
        - options
      description: endDate deve ser posterior a startDate.
    VehicleCreate:
      type: object
      properties:
        plate:
          type: string
          description: Placa brasileira antiga ou Mercosul; normalizada sem pontuação e em maiúsculas.
        model:
          type: string
          minLength: 1
          maxLength: 191
        color:
          type: string
          maxLength: 191
      required:
        - plate
