        "409":
          $ref: "#/components/responses/409"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: domusapp_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ParkingType:
      type: string
      enum:
        - RESIDENT
        - VISITOR
        - DISABLED
      description: Morador, visitante ou PcD.
    ParkingSpotInput:
      type: object
      additionalProperties: false
      required:
        - number
        - type
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 80
          example: A-01
          description: Único. Espaços são removidos e letras convertidas para maiúsculas.
        type:
          $ref: "#/components/schemas/ParkingType"
    ParkingSpotUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 80
          example: A-01
          description: Único. Espaços são removidos e letras convertidas para maiúsculas.
        type:
          $ref: "#/components/schemas/ParkingType"
    ParkingSpotAssign:
      type: object
      additionalProperties: false
      required:
        - unitId
      properties:
        unitId:
          type: string
          format: uuid
          nullable: true
          description: Unidade de destino. null desatribui a vaga.
    ParkingSpotRecord:
      type: object
      required:
        - id
        - number
        - type
        - unitId
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        type:
          $ref: "#/components/schemas/ParkingType"
        unitId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ParkingSpot:
      allOf:
        - $ref: "#/components/schemas/ParkingSpotRecord"
        - type: object
          required:
            - unit
          properties:
            unit:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
