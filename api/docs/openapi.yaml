openapi: 3.0.3
info:
  title: DomusApp API
  version: 1.0.0
  description: "Contrato centralizado das rotas. Autenticação por cookie httpOnly ou Bearer como alternativas. Para cookie
    web, faça login: o navegador não permite definir o cookie manualmente no Authorize. Entradas passam pelos schemas
    Zod e regras dos serviços."
servers:
  - url: /
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /api/status:
    get:
      tags:
        - Sistema
      summary: Consultar disponibilidade da API
      description: ""
      security: []
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /auth/register:
    post:
      tags:
        - auth
      summary: Registrar usuário
      description: O modelo de banco exige CPF, mas a entrada atual não recebe esse campo; cadastro pode responder 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "500":
          $ref: "#/components/responses/500"
  /auth/register-admin:
    post:
      tags:
        - auth
      summary: Criar administrador
      description: "Perfis permitidos: ADMIN. SYNDIC corresponde ao atributo isSyndic."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /auth/login:
    post:
      tags:
        - auth
      summary: Iniciar sessão
      description: Web recebe cookies httpOnly domusapp_token e domusapp_refresh; client=mobile recebe também token e
        refreshToken. Morador sem isSyndic não acessa o painel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
  /auth/logout:
    post:
      tags:
        - auth
      summary: Encerrar e revogar sessão
      description: Pública para permitir remover cookies mesmo após expiração.
      security: []
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "503":
          $ref: "#/components/responses/503"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Renovar sessão
      description: ""
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
  /auth/forgot-password:
    post:
      tags:
        - auth
      summary: Solicitar recuperação de senha
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPassword"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
