      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: Origem ou perfil sem permissão.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Recurso não encontrado.
      content:
        application/json:
