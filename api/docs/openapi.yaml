        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /users:
    get:
      tags:
        - users
      summary: Listar e buscar usuários
      description: "Perfis permitidos: ADMIN, FUNCIONARIO. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 191
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
    post:
      tags:
        - users
      summary: Criar usuário
      description: "Perfis permitidos: ADMIN. SYNDIC corresponde ao atributo isSyndic."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
