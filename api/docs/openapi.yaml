openapi: 3.0.3
info:
  title: DomusApp API
  version: 1.0.0
  description: "Contrato centralizado das rotas. Autenticação por cookie httpOnly ou Bearer como alternativas. Para cookie
    web, faça login: o navegador não permite definir o cookie manualmente no Authorize. Entradas passam pelos schemas
    Zod e regras dos serviços. Rotas protegidas validam cadastro ACTIVE e tokenVersion no banco a cada requisição; tokens revogados recebem 401 e indisponibilidade de validação recebe 503. Tokens legados sem versão exigem novo login."
servers:
  - url: /
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  "/reports/occupancy":
    get:
      tags: ["Relatórios"]
      summary: "Taxa atual de ocupação por bloco"
      description: "Acesso exclusivo a ADMIN, FUNCIONARIO e MORADOR com isSyndic=true. Conta uma unidade como ocupada se existir ao menos um MORADOR ACTIVE vinculado. ADMIN/FUNCIONARIO e moradores inativos não ocupam. Blocos nulos, vazios ou só com espaços são agrupados em Sem bloco. Taxa percentual = ocupadas ÷ total × 100; total geral ponderado por unidades. Não recebe período."
      responses:
        "200":
          description: "Relatório calculado; listas vazias e totais zero quando não há dados."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReportOccupancy"
        "400":
          "$ref": "#/components/responses/400"
        "401":
          "$ref": "#/components/responses/401"
        "403":
          "$ref": "#/components/responses/403"
        "500":
          "$ref": "#/components/responses/500"
        "503":
          "$ref": "#/components/responses/503"
  "/reports/charges-summary":
    get:
      tags: ["Relatórios"]
      summary: "Cobranças por mês de vencimento"
      description: "Acesso exclusivo a ADMIN, FUNCIONARIO e MORADOR com isSyndic=true. Filtra Invoice.dueDate por dias inclusivos em America/Sao_Paulo; agrega por mês local de vencimento. PAID é paga; OVERDUE é vencida independentemente da data; PENDING é vencida somente quando dueDate < instante atual (comparação estrita), caso contrário pendente. Outros estados (canceladas, expiradas, rejeitadas, estornadas, contestadas e parcialmente estornadas) são excluídos. Não altera status nem consulta o provedor. Valores são strings decimais exatas. Taxa de inadimplência = valor vencido ÷ total pago/pendente/vencido × 100, com uma casa decimal; denominador zero resulta em 0. Retorna somente meses com cobranças elegíveis."
      parameters: [{"name":"startDate","in":"query","required":false,"description":"Primeiro dia civil incluído (AAAA-MM-DD). Padrão: primeiro dia do mês de endDate menos 11 meses.","schema":{"type":"string","format":"date"}},{"name":"endDate","in":"query","required":false,"description":"Último dia civil incluído (AAAA-MM-DD). Padrão: hoje em America/Sao_Paulo. Início ≤ fim; máximo de 24 meses, sem incluir o aniversário de dois anos. Datas entre 1000-01-01 e 9998-12-31.","schema":{"type":"string","format":"date"}}]
      responses:
        "200":
          description: "Relatório calculado; listas vazias e totais zero quando não há dados."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReportCharges"
        "400":
          "$ref": "#/components/responses/400"
        "401":
          "$ref": "#/components/responses/401"
        "403":
          "$ref": "#/components/responses/403"
        "500":
          "$ref": "#/components/responses/500"
        "503":
          "$ref": "#/components/responses/503"
  "/reports/incidents":
    get:
      tags: ["Relatórios"]
      summary: "Ocorrências por categoria e status"
      description: "Acesso exclusivo a ADMIN, FUNCIONARIO e MORADOR com isSyndic=true. Filtra Incident.createdAt pelos dias inclusivos em America/Sao_Paulo. Contagens por categoria e por status atual; nenhuma informação pessoal, título ou descrição é retornada."
      parameters: [{"name":"startDate","in":"query","required":false,"description":"Primeiro dia civil incluído (AAAA-MM-DD). Padrão: primeiro dia do mês de endDate menos 11 meses.","schema":{"type":"string","format":"date"}},{"name":"endDate","in":"query","required":false,"description":"Último dia civil incluído (AAAA-MM-DD). Padrão: hoje em America/Sao_Paulo. Início ≤ fim; máximo de 24 meses, sem incluir o aniversário de dois anos. Datas entre 1000-01-01 e 9998-12-31.","schema":{"type":"string","format":"date"}}]
      responses:
        "200":
          description: "Relatório calculado; listas vazias e totais zero quando não há dados."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReportIncidents"
        "400":
          "$ref": "#/components/responses/400"
        "401":
          "$ref": "#/components/responses/401"
        "403":
          "$ref": "#/components/responses/403"
        "500":
          "$ref": "#/components/responses/500"
        "503":
          "$ref": "#/components/responses/503"
  "/reports/reservations":
    get:
      tags: ["Relatórios"]
      summary: "Reservas por área comum e status"
      description: "Acesso exclusivo a ADMIN, FUNCIONARIO e MORADOR com isSyndic=true. Filtra Reservation.date pelo dia civil inclusivo, respeitando o armazenamento a 00:00 UTC. Contagens por área (identificada por ID, incluindo áreas inativas com reservas históricas) e por status atual. Todos os status são incluídos; solicitações aprovadas não comprovam uso efetivo."
      parameters: [{"name":"startDate","in":"query","required":false,"description":"Primeiro dia civil incluído (AAAA-MM-DD). Padrão: primeiro dia do mês de endDate menos 11 meses.","schema":{"type":"string","format":"date"}},{"name":"endDate","in":"query","required":false,"description":"Último dia civil incluído (AAAA-MM-DD). Padrão: hoje em America/Sao_Paulo. Início ≤ fim; máximo de 24 meses, sem incluir o aniversário de dois anos. Datas entre 1000-01-01 e 9998-12-31.","schema":{"type":"string","format":"date"}}]
      responses:
        "200":
          description: "Relatório calculado; listas vazias e totais zero quando não há dados."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReportReservations"
        "400":
          "$ref": "#/components/responses/400"
        "401":
          "$ref": "#/components/responses/401"
        "403":
          "$ref": "#/components/responses/403"
        "500":
          "$ref": "#/components/responses/500"
        "503":
          "$ref": "#/components/responses/503"
  /api/status:
    get:
      tags:
        - Sistema
      summary: Consultar disponibilidade da API
      description: ""
      security: []
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /auth/login:
    post:
      tags:
        - auth
      summary: Iniciar sessão
      description: Web recebe cookies httpOnly domusapp_token e domusapp_refresh; client=mobile recebe também token e
        refreshToken. Com client=panel, perfil sem acesso ao painel (morador sem isSyndic) recebe 403
        sem cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
  /auth/logout:
    post:
      tags:
        - auth
      summary: Encerrar e revogar sessão
      description: Pública para permitir remover cookies mesmo após expiração.
      security: []
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "503":
          $ref: "#/components/responses/503"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Renovar sessão
      description: ""
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
  /auth/forgot-password:
    post:
      tags:
        - auth
      summary: Solicitar recuperação de senha
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPassword"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/400"
        "429":
          $ref: "#/components/responses/429"
  /auth/reset-password:
    post:
      tags:
        - auth
      summary: Redefinir senha
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPassword"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/400"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
  /auth/me:
    get:
      tags:
        - auth
      summary: Consultar usuário da sessão
      description: Retorna o próprio perfil atualizado com unidade, para qualquer usuário ACTIVE autenticado. Não concede privilégios administrativos; usuários inativos ou excluídos recebem 401.
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /users/me:
    get:
      tags:
        - users
      summary: Consultar perfil do token (legado)
      deprecated: true
      description: Mantido por compatibilidade. Clientes novos devem consultar GET /auth/me.
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  perfil:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /users:
    get:
      tags:
        - users
      summary: Listar e buscar usuários
      description: "Perfis permitidos: ADMIN, FUNCIONARIO. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 191
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
    post:
      tags:
        - users
      summary: Criar usuário
      description: "Perfis permitidos: ADMIN. SYNDIC corresponde ao atributo isSyndic."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /users/{id}:
    get:
      tags:
        - users
      summary: Buscar usuário
      description: "Perfis permitidos: ADMIN, FUNCIONARIO. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    put:
      tags:
        - users
      summary: Atualizar usuário
      description: "Perfis permitidos: ADMIN. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
    delete:
      tags:
        - users
      summary: Excluir usuário
      description: "Perfis permitidos: ADMIN. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /units:
    get:
      tags:
        - units
      summary: Listar unidades
      description: "Perfis permitidos: ADMIN, FUNCIONARIO. SYNDIC corresponde ao atributo isSyndic."
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    type:
                      type: string
                      enum:
                        - APARTMENT
                        - HOUSE
                    block:
                      type: string
                      maxLength: 50
                    number:
                      type: string
                      minLength: 1
                      maxLength: 20
                    parkingSpots:
                      type: integer
                      minimum: 0
                      readOnly: true
                      description: Contador derivado das vagas atribuídas; não editável.
                    parkingSpotRecords:
                      type: array
                      readOnly: true
                      items:
                        $ref: "#/components/schemas/ParkingSpotRecord"
                      description: Vagas numeradas atribuídas, ordenadas por número. Números PROV são provisórios, criados na migração para preservar os limites existentes.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
    post:
      tags:
        - units
      summary: Criar unidade
      description: "Perfis permitidos: ADMIN. SYNDIC corresponde ao atributo isSyndic."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitCreate"
      responses:
        "201":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /units/{id}:
    put:
      tags:
        - units
      summary: Atualizar unidade
      description: "Perfis permitidos: ADMIN. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitUpdate"
      responses:
        "200":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
    delete:
      tags:
        - units
      summary: Excluir unidade
      description: "Perfis permitidos: ADMIN. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /notices:
    get:
      tags:
        - notices
      summary: Listar avisos
      description: ""
      responses:
        "200":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
    post:
      tags:
        - notices
      summary: Criar registro em avisos
      description: "Perfis permitidos: ADMIN, SYNDIC. SYNDIC corresponde ao atributo isSyndic."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeCreate"
      responses:
        "201":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /notices/{id}:
    put:
      tags: [notices]
      summary: Editar registro parcialmente
      description: "ADMIN edita qualquer aviso; síndica somente os próprios. Mudanças de título, conteúdo ou destinatários resetam leituras. Status e prioridade preservam leituras. Campos omitidos são preservados; exige pelo menos um campo editável. Campos desconhecidos são descartados."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeUpdate'
      responses:
        '200':
          description: Registro atualizado.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
    delete:
      tags:
        - notices
      summary: Excluir registro de avisos
      description: "Perfis permitidos: ADMIN, SYNDIC. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /events:
    get:
      tags:
        - events
      summary: Listar eventos
      description: ""
      responses:
        "200":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
    post:
      tags:
        - events
      summary: Criar registro em eventos
      description: "Perfis permitidos: ADMIN, SYNDIC. SYNDIC corresponde ao atributo isSyndic."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /events/{id}:
    put:
      tags: [events]
      summary: Editar registro parcialmente
      description: "ADMIN edita qualquer evento; síndica somente os próprios. Permite publicar e cancelar eventos. Campos omitidos são preservados; exige pelo menos um campo editável. Campos desconhecidos são descartados."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: Registro atualizado.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
    delete:
      tags:
        - events
      summary: Excluir registro de eventos
      description: "Perfis permitidos: ADMIN, SYNDIC. SYNDIC corresponde ao atributo isSyndic."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"
  /votings:
    get:
      tags: [votings]
      summary: Listar votações e o voto da unidade
      description: >-
